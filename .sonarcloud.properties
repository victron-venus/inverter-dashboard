sonar.organization=victron-venus
sonar.projectKey=victron-venus_inverter-dashboard
sonar.sources=.
# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=**/test_*.py,**/tests/**,logs/**,.venv/**,scripts/prepare_version.py,scripts/release_versioned.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Ignore shell best-practice issues (scripts target POSIX compatibility)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e2.ruleKey=shelldre:S7677
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=shelldre:S100
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e4.ruleKey=shelldre:S7686
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.e5.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.sh

# uv sync builds the local inverter-dashboard package from trusted, in-repo source
# (no prebuilt wheel exists for it), so allowing setup script execution here is intentional.
sonar.issue.ignore.multicriteria.e6.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e6.resourceKey=Dockerfile

# Pinning both the tag (for readability) and the digest (for reproducibility) on
# base images is intentional here, not an oversight.
sonar.issue.ignore.multicriteria.e7.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e7.resourceKey=Dockerfile

# requirements.txt already pins exact versions for every dependency (kept in
# sync with uv.lock) for reproducible PyInstaller builds; pip has no built-in
# hash-locking enforcement, so this is an accepted, intentional trade-off.
sonar.issue.ignore.multicriteria.e8.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e8.resourceKey=.github/workflows/publish-release.yml
