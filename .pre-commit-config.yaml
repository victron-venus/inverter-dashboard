repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--exclude=SC2154, --exclude=SC2164, --exclude=SC2181, --exclude=SC2029, --exclude=SC1091]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
    # Published generated assets are immutable and checked byte-for-byte below.
    exclude: ^src/inverter_dashboard/static/assets/
  - id: trailing-whitespace
    exclude: ^src/inverter_dashboard/static/assets/
- repo: https://github.com/pylint-dev/pylint
  rev: v4.0.6
  hooks:
  - id: pylint
- repo: local
  hooks:
  - id: verify-vue-release-bytes
    name: Verify published Vue bytes survive Git checkout
    language: system
    entry: python3 -B -m unittest discover -s scripts -p test_vue_checkout.py
    pass_filenames: false
    always_run: true
