# Dedicated Traefik on mp (IngressClass traefik-mp) + OpenWRT:
#   address=/mp.2560801.xyz/192.168.151.107
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inverter-dashboard
  labels:
    app: inverter-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik-mp
  rules:
    - host: inverter.mp.2560801.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inverter-dashboard
                port:
                  number: 8080
