# Example ingress. Set your real host and ingress class in an ignored local overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inverter-dashboard
  labels:
    app: inverter-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts:
  #       - dashboard.example.com
  #     secretName: inverter-dashboard-tls
  rules:
    - host: dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inverter-dashboard
                port:
                  number: 8080
