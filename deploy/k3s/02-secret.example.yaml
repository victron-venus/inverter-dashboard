# EXAMPLE ONLY — do not commit real tokens.
# Preferred production shape: mount a Secret (or PVC) as /app/config with local_config.py
# copied from local_config.example.py (HA_URL / HA_TOKEN, etc.).
#
# Also create a second Secret (or extend this one) for IGW CF Access + bearer —
# see 03-deployment.yaml envFrom. Values live in foss-cloudflare-infrastructure
# local.generated.service-token.json + inverter-gateway .env (GATEWAY_API_TOKEN).
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-config
  labels:
    app: inverter-dashboard
type: Opaque
stringData:
  # Placeholder local_config.py — replace before real deploy
  local_config.py: |
    # Example only — fill HA_URL / HA_TOKEN out-of-band; never commit real values.
    HA_URL = "http://homeassistant.homeassistant.svc.cluster.local:8123"
    HA_TOKEN = "replace-me"
    HA_ENABLED = False
---
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-gateway
  labels:
    app: inverter-dashboard
type: Opaque
stringData:
  GATEWAY_ACCESS_CLIENT_ID: "replace-with-cf-access-client-id"
  GATEWAY_ACCESS_CLIENT_SECRET: "replace-with-cf-access-client-secret"
  GATEWAY_API_TOKEN: "replace-with-GATEWAY_API_TOKEN"
