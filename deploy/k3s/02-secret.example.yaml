# EXAMPLE ONLY — do not commit real tokens.
# Preferred production shape: mount a Secret (or PVC) as /app/config with local_config.py
# copied from local_config.example.py (HA_URL / HA_TOKEN, etc.).
#
# Also create a second Secret (or extend this one) for IGW auth —
# see 03-deployment.yaml envFrom.
#
# In-cluster ClusterIP (default GATEWAY_URL): leave CF Access id/secret EMPTY;
# only GATEWAY_API_TOKEN (Bearer) is required. CF Access headers are only needed
# when GATEWAY_URL is the public hostname (https://victron.2560801.xyz).
# Token source: inverter-gateway .env GATEWAY_API_TOKEN.
# CF service token (optional/public path): foss-cloudflare-infrastructure
# local.generated.service-token.json.
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-config
  labels:
    app: inverter-dashboard
type: Opaque
stringData:
  # Placeholder local_config.py — replace before real deploy
  local_config.py: |
    # Example only — fill HA_URL / HA_TOKEN out-of-band; never commit real values.
    HA_URL = "http://homeassistant.homeassistant.svc.cluster.local:8123"
    HA_TOKEN = "replace-me"
    HA_ENABLED = False
---
apiVersion: v1
kind: Secret
metadata:
  name: inverter-dashboard-gateway
  labels:
    app: inverter-dashboard
type: Opaque
stringData:
  # Empty for ClusterIP; set only when using public CF GATEWAY_URL
  GATEWAY_ACCESS_CLIENT_ID: ""
  GATEWAY_ACCESS_CLIENT_SECRET: ""
  GATEWAY_API_TOKEN: "replace-with-GATEWAY_API_TOKEN"
