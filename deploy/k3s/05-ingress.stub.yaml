# Ingress for Traefik-mp (LAN HTTP on *.mp.2560801.xyz).
# OpenWRT: address=/mp.2560801.xyz/192.168.151.107 covers this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inverter-dashboard
  labels:
    app: inverter-dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik-mp
  # tls:
  #   - hosts:
  #       - inverter-dashboard.mp.2560801.xyz
  #     secretName: inverter-dashboard-tls
  rules:
    - host: inverter-dashboard.mp.2560801.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inverter-dashboard
                port:
                  number: 8080
