apiVersion: v1
kind: ConfigMap
metadata:
  name: inverter-dashboard
  labels:
    app: inverter-dashboard
data:
  # Example endpoint; set the real gateway URL in an ignored local overlay.
  GATEWAY_ENABLED: "true"
  GATEWAY_URL: "https://gateway.example.com"
  GATEWAY_POLL_INTERVAL: "2"
  # Explicit empty: pydantic default is "Cerbo"; blank keeps this example IGW-only
  # (dual-path would probe MQTT when both are set). Optional: set a real
  # MQTT_HOST alongside GATEWAY_* for LAN-first + IGW fallback.
  MQTT_HOST: ""
  HOST: "0.0.0.0"
  WEB_PORT: "8080"
  INVERTER_DASHBOARD_CONFIG: "/app/config"
  # Set the deployment-specific portal identifier in an ignored local overlay.
  CERBO_PORTAL_ID: ""
