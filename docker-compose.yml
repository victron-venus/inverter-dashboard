services:
  inverter-dashboard:
    image: alvit/inverter-dashboard:latest
    container_name: inverter-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8080:8080" # HTTP default; app reads WEB_PORT / --port
    environment:
      - MQTT_HOST=192.168.x.x # Cerbo / broker IP
      - MQTT_PORT=1883
    # HTTPS in-container example (see README): map 8443, set WEB_PORT=8443, mount certs,
    # override command with --ssl-cert/--ssl-key, and adjust or disable HEALTHCHECK for TLS-only.
