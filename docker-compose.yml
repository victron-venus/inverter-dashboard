services:
  inverter-dashboard:
    image: alvit/inverter-dashboard:latest
    # Image defaults to UID/GID 1000 (see Dockerfile).
    # If mounted config files are not readable, set user to match the file owner on the host.
    user: "1000:1000"
    container_name: inverter-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8080:8080" # container listens on WEB_PORT (8080); use e.g. "8443:8080" if you prefer
    environment:
      - MQTT_HOST=192.168.x.x # Cerbo / broker IP
      - MQTT_PORT=1883
      - INVERTER_DASHBOARD_CONFIG=/app/config
      - CERBO_PORTAL_ID= # VRM portal ID of your Cerbo GX - enables dbus-pump water topics
    volumes:
      # Synology NAS (primary deployment path). On dev machines without this path, comment out or override.
      - /volume1/docker/inverter-dashboard/config:/app/config:ro
