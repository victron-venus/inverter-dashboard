version: '3.8'

services:
  inverter-dashboard:
    image: alvit/inverter-dashboard:latest
    container_name: inverter-dashboard
    ports:
      - "8080:8080"
    environment:
      - MQTT_HOST=${MQTT_HOST:-192.168.160.150}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - WEB_PORT=8080
      - INVERTER_DASHBOARD_CONFIG=/app/config
    # volumes:
    #   - /volume1/docker/inverter-dashboard/config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/scripts/docker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower: Auto-updates containers when new images are available
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - TZ=America/Los_Angeles
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
