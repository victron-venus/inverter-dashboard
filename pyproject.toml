[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inverter-dashboard"
version = "0.0.0"  # read from VERSION at runtime
description = "Remote web dashboard for Victron Cerbo GX inverter control"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
    "paho-mqtt>=2.1.0",
    "msgpack>=1.2.1",
    "httpx>=0.28.1",
]

[project.scripts]
inverter-dashboard = "inverter_dashboard.server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inverter_dashboard = ["VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
