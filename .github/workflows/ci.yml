name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@2f679e8adc653a0d599fde5f627d387c6207a219
    with:
      python-version: '3.12'
      coverage-threshold: 68

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # NOTE: integration-tests/.github/workflows/integration.yml has workflow_call but
    # assumes sibling repo layout (../inverter-dashboard). We implement the pattern
    # locally instead of workflow_call.
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout integration-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victron-venus/integration-tests
          path: integration-tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@5bc4a28d0eed8531e4dfa2da3ab1a5e2e6c5df3a # v3.10.0

      - name: Build test image
        run: |
          docker build \
            -f integration-tests/Dockerfile.test-runner \
            -t test-runner \
            .

      - name: Start test stack
        run: |
          docker compose \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            up -d --build mqtt-broker mock-dbus mock-battery mock-pv
          sleep 5

      - name: Build dashboard test image
        run: |
          docker compose \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            up -d --build dashboard-python
          sleep 10

      - name: Run integration tests
        run: |
          docker compose \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            run --rm \
            -e DASHBOARD_URL=ws://dashboard-python:8080/ws \
            -e MQTT_HOST=mqtt-broker \
            -e MQTT_PORT=1883 \
            test-runner python -m pytest tests/ -v --tb=short

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-report
          path: report.html
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f integration-tests/docker-compose.yml \
            -f integration-tests/docker-compose.test.yml \
            down -v
