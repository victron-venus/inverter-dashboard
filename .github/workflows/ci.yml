name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@2f679e8adc653a0d599fde5f627d387c6207a219
    with:
      python-version: '3.12'
      # Repo measures ~62% (server.py / websocket_handler.py untested). The
      # 80% toolkit default never ran before — pip install used to fail on
      # python 3.11 before coverage executed. Raise as tests are added.
      coverage-threshold: 62
