name: Auto Approve (DISABLED)

# DISABLED: auto-approve + auto-merge on pull_request_target is a security risk.
# This workflow is kept as documentation only. Do not re-enable without adding
# human review gates for auto-deployed code.
#
# Risk: pull_request_target runs in the base branch context with write access to
# secrets. An attacker-controlled PR (e.g. from a compromised contributor account)
# could inject code that auto-merges to main and auto-deploys to all installations.
#
# See: https://securitylab.github.com/resources/pull_request_target-exploits/

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Type YES to confirm you understand the security implications'
        required: true

permissions:
  pull-requests: write

jobs:
  disabled:
    runs-on: ubuntu-latest
    if: github.event.inputs.acknowledge == 'YES'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Warn
        run: echo "Auto-approve is disabled. Please use manual review instead."
