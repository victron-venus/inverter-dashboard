name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

env:
  PYTHON_VERSION: '3.13'
  PYINSTALLER_VERSION: '6.11.1'

permissions: {}  # Scoped per job below

jobs:
  docker-nightly:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inverter-dashboard:nightly

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt
      - name: Build Linux x86_64
        run: |
          pyinstaller --onefile --noconfirm \
            --target-arch x86_64 \
            --name inverter-dashboard \
            --distpath dist/linux-x86_64 \
            --workpath build/linux-x86_64 \
            --paths src \
            --hidden-import=inverter_dashboard \
            --hidden-import=inverter_dashboard.config \
            --hidden-import=inverter_dashboard.version \
            --hidden-import=inverter_dashboard.mqtt_handler \
            --hidden-import=inverter_dashboard.websocket_handler \
            --hidden-import=inverter_dashboard.html_template \
            --hidden-import=inverter_dashboard.ha_client \
            --hidden-import=inverter_dashboard.scripts.docker_healthcheck \
            --add-data 'VERSION:.' \
            src/inverter_dashboard/__main__.py
      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-linux-x86_64
          path: dist/linux-x86_64/inverter-dashboard

  release-nightly:
    needs: [docker-nightly, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inverter-dashboard-linux-x86_64
          path: artifacts/inverter-dashboard-linux-x86_64
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: nightly
          name: "Nightly Build (Development)"
          body: |
            Automated daily build of PyInstaller binaries and Docker image (`ghcr.io/${{ github.repository_owner }}/inverter-dashboard:nightly`).
            Commit: ${{ github.sha }}
          prerelease: true
          overwrite_files: true
          files: artifacts/**/*
