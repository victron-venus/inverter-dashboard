name: Candidate PWA lifecycle and native Safari smoke

on:
  workflow_call:
    inputs:
      candidate_artifact_id:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  pwa:
    name: Service Worker lifecycle (Chromium engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BROWSER_CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      CI_BROWSER_DIAGNOSTICS: .browser-pwa/identity
      CI_PWA_CANDIDATE: ${{ github.workspace }}/.browser-pwa/identity/candidate.json
      CI_PWA_OUTPUT: ${{ github.workspace }}/.browser-pwa/result
      CI_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/browser-compatibility/playwright-1-64-0/node_modules/playwright
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          merge-multiple: true
          path: .browser-pwa/artifact
      - name: Verify candidate and install locked test engine
        run: |
          python3 scripts/prepare_browser_candidate.py .browser-pwa/artifact .browser-pwa/prepared
          npm ci --prefix tools/browser-compatibility/playwright-1-64-0 --ignore-scripts
          node tools/browser-compatibility/playwright-1-64-0/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise real worker lifecycle with isolated push boundaries
        run: node scripts/pwa_acceptance.cjs
      - name: Retain engine evidence without claiming OS notification delivery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-pwa-${{ github.run_attempt }}
          path: |
            .browser-pwa/identity/*.json
            .browser-pwa/result/*
          if-no-files-found: error
          retention-days: 90

  safari:
    name: Native Safari on macOS (partial smoke)
    if: ${{ inputs.channel == 'rc' }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CI_BROWSER_CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      CI_BROWSER_DIAGNOSTICS: .browser-native/identity
      CI_PWA_CANDIDATE: ${{ github.workspace }}/.browser-native/identity/candidate.json
      CI_NATIVE_OUTPUT: ${{ github.workspace }}/.browser-native/result
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          merge-multiple: true
          path: .browser-native/artifact
      - name: Verify exact candidate bytes
        run: python3 scripts/prepare_browser_candidate.py .browser-native/artifact .browser-native/prepared
      - name: Exercise installed Safari in the disposable hosted runner
        run: node scripts/native_acceptance_smoke.cjs
      - name: Retain partial native smoke and explicit unsupported observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-native-safari-${{ github.run_attempt }}
          path: |
            .browser-native/identity/*.json
            .browser-native/result/*
          if-no-files-found: error
          retention-days: 90
