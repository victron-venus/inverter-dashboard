name: Hosted macOS trust component

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hosted-trust-component.yml'
      - 'scripts/hosted_trust_component.cjs'
      - 'scripts/hosted_trust_component.test.cjs'
      - 'scripts/hosted_trust_observer.m'

permissions: {}

jobs:
  trust-lifecycle:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Isolated admin trust lifecycle component
    runs-on: macos-15
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      TRUST_COMPONENT_MODE: admin-trust-lifecycle-v1
      TRUST_COMPONENT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify offline failure and sanitization controls
        run: node --test scripts/hosted_trust_component.test.cjs
      - name: Measure one disposable admin trust lifecycle
        run: node scripts/hosted_trust_component.cjs
      - name: Retain sanitized component observations, never native acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-trust-component-${{ github.run_attempt }}
          path: .hosted-trust-component/result.json
          if-no-files-found: error
          retention-days: 30
