name: Publish Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  PYINSTALLER_VERSION: '6.11.1'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt

      - name: Build Linux x86_64
        run: |
          pyinstaller --target-arch x86_64 inverter-dashboard.spec \
            --distpath dist/linux-x86_64 \
            --workpath build/linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: inverter-dashboard-linux-x86_64
          path: dist/linux-x86_64/inverter-dashboard

  build-macos-x64:
    runs-on: macos-13  # Intel Mac
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt

      - name: Build macOS x86_64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch x86_64" \
          LDFLAGS="-arch x86_64" \
          pyinstaller --target-arch x86_64 inverter-dashboard.spec \
            --distpath dist/macos-x86_64 \
            --workpath build/macos-x86_64

      - name: Make executable
        run: chmod +x dist/macos-x86_64/inverter-dashboard

      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: inverter-dashboard-macos-x86_64
          path: dist/macos-x86_64/inverter-dashboard

  build-macos-arm64:
    runs-on: macos-14  # Apple Silicon
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt

      - name: Build macOS arm64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64" \
          pyinstaller --target-arch arm64 inverter-dashboard.spec \
            --distpath dist/macos-arm64 \
            --workpath build/macos-arm64

      - name: Make executable
        run: chmod +x dist/macos-arm64/inverter-dashboard

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: inverter-dashboard-macos-arm64
          path: dist/macos-arm64/inverter-dashboard

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt

      - name: Build Windows x86_64
        run: |
          pyinstaller --target-arch x86_64 inverter-dashboard.spec `
            --distpath dist/windows-x86_64 `
            --workpath build/windows-x86_64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: inverter-dashboard-windows-x86_64
          path: dist/windows-x86_64/inverter-dashboard.exe

  release:
    needs: [build-linux, build-macos-x64, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create ZIP archives
        run: |
          cd artifacts
          mkdir -p ../release
          for dir in */; do
            platform=$(basename "$dir")
            cd "$dir"
            # Handle both executables and .app bundles
            if [ -d "inverter-dashboard.app" ]; then
              zip -r "../../release/inverter-dashboard-${platform}.zip" inverter-dashboard.app
            else
              for f in inverter-dashboard*; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.zip) cp "$f" "../../release/inverter-dashboard-${platform}.zip" ;;
                  *) zip -j "../../release/inverter-dashboard-${platform}.zip" "$f" ;;
                esac
              done
            fi
            cd ..
          done
          ls -la ../release/

      - name: Create SHA256 checksums
        run: |
          cd release
          for f in *.zip; do
            sha256sum "$f" > "${f}.sha256"
          done
          cat *.sha256
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.txt \
            release/*.zip release/*.sha256

      - name: Report
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "Release published: $TAG"
          echo "Artifacts:"
          find release -type f -name "*.zip" -exec ls -lh {} \;