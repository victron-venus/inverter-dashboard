  build-macos-arm64:
    runs-on: macos-14  # Apple Silicon
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt

      - name: Build macOS arm64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64" \
          pyinstaller --onefile --noconfirm \
            --target-arch arm64 \
            --name inverter-dashboard \
            --distpath dist/macos-arm64 \
            --workpath build/macos-arm64 \
            --hidden-import=server \
            --hidden-import=config \
            --hidden-import=version \
            --hidden-import=mqtt_handler \
            --hidden-import=websocket_handler \
            --hidden-import=html_template \
            --hidden-import=ha_client \
            --hidden-import=scripts.docker_healthcheck \
            --add-data 'VERSION:.' \
            server.py

      - name: Make executable
        run: chmod +x dist/macos-arm64/inverter-dashboard

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-macos-arm64
          path: dist/macos-arm64/inverter-dashboard

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt

      - name: Build Windows x86_64
        run: |
          pyinstaller --onefile --noconfirm `
            --target-arch x86_64 `
            --name inverter-dashboard `
            --distpath dist/windows-x86_64 `
            --workpath build/windows-x86_64 `
            --hidden-import=server `
            --hidden-import=config `
            --hidden-import=version `
            --hidden-import=mqtt_handler `
            --hidden-import=websocket_handler `
            --hidden-import=html_template `
            --hidden-import=ha_client `
            --hidden-import=scripts.docker_healthcheck `
            --add-data 'VERSION;.' `
            server.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-windows-x86_64
          path: dist/windows-x86_64/inverter-dashboard.exe

  release:
    needs: [build-linux, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create ZIP archives
        run: |
          cd artifacts
          mkdir -p ../release
          for dir in */; do
            platform=$(basename "$dir")
            # Remove 'inverter-dashboard-' prefix if present to avoid double naming
            platform=${platform#inverter-dashboard-}
            cd "$dir"
            # Handle both executables and .app bundles
            if [ -d "inverter-dashboard.app" ]; then
              zip -r "../../release/inverter-dashboard-${platform}.zip" inverter-dashboard.app
            else
              for f in inverter-dashboard*; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.zip) cp "$f" "../../release/inverter-dashboard-${platform}.zip" ;;
                  *) zip -j "../../release/inverter-dashboard-${platform}.zip" "$f" ;;
                esac
              done
            fi
            cd ..
          done
          ls -la ../release/

      - name: Create SHA256 checksums
        run: |
          cd release
          for f in *.zip; do
            sha256sum "$f" > "${f}.sha256"
          done
          cat *.sha256
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          # Delete existing release if exists
          gh release delete "$TAG" --yes || true
          echo "## Binary artifacts built by CI/CD" > release.txt
          ls -lh release/*.zip 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> release.txt
          cat release.txt
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release.txt \
            release/*.zip release/*.sha256

      - name: Report
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "Release published: $TAG"
          echo "Artifacts:"
          find release -type f -name "*.zip" -exec ls -lh {} \;