name: Publish Release Binaries

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.13'
  PIP_VERSION: '25.2'
  PYINSTALLER_VERSION: '6.11.1'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build Linux x86_64
        run: |
          pyinstaller inverter-dashboard.spec \
            --distpath dist/linux-x86_64 \
            --workpath build/linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-linux-x86_64
          path: dist/linux-x86_64/inverter-dashboard

  build-macos-x64:
    runs-on: macos-13  # Intel Mac
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build macOS x86_64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch x86_64" \
          LDFLAGS="-arch x86_64" \
          pyinstaller inverter-dashboard.spec \
            --distpath dist/macos-x86_64 \
            --workpath build/macos-x86_64

      - name: Make executable
        run: chmod +x dist/macos-x86_64/inverter-dashboard

      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-macos-x86_64
          path: dist/macos-x86_64/inverter-dashboard

  build-macos-arm64:
    runs-on: macos-14  # Apple Silicon
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build macOS arm64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64" \
          pyinstaller inverter-dashboard.spec \
            --distpath dist/macos-arm64 \
            --workpath build/macos-arm64

      - name: Make executable
        run: chmod +x dist/macos-arm64/inverter-dashboard

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-macos-arm64
          path: dist/macos-arm64/inverter-dashboard

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build Windows x86_64
        run: |
          pyinstaller inverter-dashboard.spec `
            --distpath dist/windows-x86_64 `
            --workpath build/windows-x86_64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-windows-x86_64
          path: dist/windows-x86_64/inverter-dashboard.exe

  release:
    needs: [build-linux, build-macos-x64, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.1.8
        with:
          path: artifacts

      - name: Create ZIP archives
        run: |
          cd artifacts
          mkdir -p ../release
          for dir in */; do
            platform=$(basename "$dir")
            platform=${platform#inverter-dashboard-}
            cd "$dir"
            if [ -d "inverter-dashboard.app" ]; then
              zip -r "../../release/inverter-dashboard-${platform}.zip" inverter-dashboard.app
            else
              for f in inverter-dashboard*; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.zip) cp "$f" "../../release/inverter-dashboard-${platform}.zip" ;;
                  *) zip -j "../../release/inverter-dashboard-${platform}.zip" "$f" ;;
                esac
              done
            fi
            cd ..
          done
          ls -la ../release/

      - name: Create SHA256 checksums
        run: |
          cd release
          for f in *.zip; do
            sha256sum "$f" > "${f}.sha256"
          done
          cat ./*.sha256
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ -(alpha|beta|rc)\.[0-9]+ || "$TAG" =~ - ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Delete existing release if exists
          gh release delete "$TAG" --yes || true
          echo "## Binary artifacts built by CI/CD" > release.txt
          ls -lh release/*.zip 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> release.txt
          cat release.txt
          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            --title "$TAG" \
            --notes-file release.txt \
            release/*.zip release/*.sha256

      - name: Report
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "Release published: $TAG"
          echo "Artifacts:"
          find release -type f -name "*.zip" -exec ls -lh {} \;
