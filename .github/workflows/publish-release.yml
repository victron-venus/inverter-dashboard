name: Publish Release Binaries

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.13'
  PIP_VERSION: '25.2'
  PYINSTALLER_VERSION: '6.11.1'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build Linux x86_64
        run: |
          pyinstaller inverter-dashboard.spec \
            --distpath dist/linux-x86_64 \
            --workpath build/linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-linux-x86_64
          path: dist/linux-x86_64/inverter-dashboard

  build-macos-x64:
    runs-on: macos-13  # Intel Mac
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build macOS x86_64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch x86_64" \
          LDFLAGS="-arch x86_64" \
          pyinstaller inverter-dashboard.spec \
            --distpath dist/macos-x86_64 \
            --workpath build/macos-x86_64

      - name: Make executable
        run: chmod +x dist/macos-x86_64/inverter-dashboard

      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-macos-x86_64
          path: dist/macos-x86_64/inverter-dashboard

  build-macos-arm64:
    runs-on: macos-14  # Apple Silicon
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build macOS arm64
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64" \
          pyinstaller inverter-dashboard.spec \
            --distpath dist/macos-arm64 \
            --workpath build/macos-arm64

      - name: Make executable
        run: chmod +x dist/macos-arm64/inverter-dashboard

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-macos-arm64
          path: dist/macos-arm64/inverter-dashboard

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }} -r requirements.txt --no-build

      - name: Build Windows x86_64
        run: |
          pyinstaller inverter-dashboard.spec `
            --distpath dist/windows-x86_64 `
            --workpath build/windows-x86_64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.6.2
        with:
          name: inverter-dashboard-windows-x86_64
          path: dist/windows-x86_64/inverter-dashboard.exe

  release:
    needs: [build-linux, build-macos-x64, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@ea165f8d65b6e75b540449e9274886f43607fa02 # v4.1.8
        with:
          path: artifacts

      - name: Create ZIP archives
        run: |
          cd artifacts
          mkdir -p ../release
          for dir in */; do
            platform=$(basename "$dir")
            platform=${platform#inverter-dashboard-}
            cd "$dir"
            if [ -d "inverter-dashboard.app" ]; then
              zip -r "../../release/inverter-dashboard-${platform}.zip" inverter-dashboard.app
            else
              for f in inverter-dashboard*; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.zip) cp "$f" "../../release/inverter-dashboard-${platform}.zip" ;;
                  *) zip -j "../../release/inverter-dashboard-${platform}.zip" "$f" ;;
                esac
              done
            fi
            cd ..
          done
          ls -la ../release/

      - name: Create SHA256 checksums
        run: |
          cd release
          for f in *.zip; do
            sha256sum "$f" > "${f}.sha256"
          done
          cat ./*.sha256
          ls -la

      - name: Create release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "## Binary artifacts built by CI/CD" > release.txt
          ls -lh release/*.zip 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> release.txt
          cat release.txt

      - name: Detect Prerelease
        id: detect_prerelease
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ "$TAG" =~ -(alpha|beta|rc)\.[0-9]+ || "$TAG" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: victron-venus/venus-os-ci-toolkit/.github/workflows/release.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
        with:
          skip-checkout: true
          body-file: release.txt
          generate-notes: false
          prerelease: ${{ steps.detect_prerelease.outputs.is_prerelease == 'true' }}
          files: release/*
