name: Publish Release Binaries

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            executable: inverter-dashboard
          - platform: macos-x86_64
            runner: macos-15-intel
            executable: inverter-dashboard
          - platform: macos-arm64
            runner: macos-14
            executable: inverter-dashboard
          - platform: windows-x86_64
            runner: windows-2025
            executable: inverter-dashboard.exe
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Install locked dependencies
        run: uv sync --locked --group packaging --no-dev --no-install-project --no-build
      - name: Build binary
        run: uv run --no-sync --no-build python -m PyInstaller --clean --noconfirm inverter-dashboard.spec
      - name: Smoke test frozen application
        run: uv run --no-sync --no-build python scripts/check_frozen_binary.py dist/${{ matrix.executable }}
      - name: Package verified binary
        run: uv run --no-sync --no-build python scripts/package_binary.py dist/${{ matrix.executable }} ${{ matrix.platform }}
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inverter-dashboard-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: inverter-dashboard-*
          path: release
          merge-multiple: true
      - name: Verify complete artifact set
        shell: bash
        run: |
          cd release
          for platform in linux-x86_64 macos-x86_64 macos-arm64 windows-x86_64; do
            test -s "inverter-dashboard-${platform}.zip"
            sha256sum --check "inverter-dashboard-${platform}.zip.sha256"
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.sha256
