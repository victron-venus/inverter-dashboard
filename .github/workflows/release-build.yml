name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        description: Committed base version, without a v prefix or channel suffix
        required: true
        type: string
      channel:
        description: nightly, beta or rc; stable promotes existing RC bytes
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  PYTHON_VERSION: '3.13'
defaults:
  run:
    shell: bash
jobs:
  binaries:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-x86_64
          runner: ubuntu-24.04
          executable: inverter-dashboard
        - platform: macos-x86_64
          runner: macos-15-intel
          executable: inverter-dashboard
        - platform: macos-arm64
          runner: macos-14
          executable: inverter-dashboard
        - platform: windows-x86_64
          runner: windows-2025
          executable: inverter-dashboard.exe
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify committed release version
      run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - name: Install locked dependencies
      run: uv sync --locked --group packaging --no-dev --no-install-project --no-build
    - name: Build binary
      run: uv run --no-sync --no-build python -m PyInstaller --clean --noconfirm inverter-dashboard.spec
    - name: Smoke test frozen application
      run: uv run --no-sync --no-build python scripts/check_frozen_binary.py dist/${{ matrix.executable }}
    - name: Package verified binary
      run: uv run --no-sync --no-build python scripts/package_binary.py dist/${{ matrix.executable }} ${{ matrix.platform
        }}
    - name: Store release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets-${{ matrix.platform }}
        path: release/*
        if-no-files-found: error
        retention-days: 14
  container:
    name: Build container archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify committed release version
      run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
    - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - name: Build OCI image archive
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        outputs: type=oci,dest=inverter-dashboard-container.oci.tar
        tags: inverter-dashboard:${{ inputs.version }}
        sbom: true
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Store release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets-container
        path: inverter-dashboard-container.oci.tar
        if-no-files-found: error
        retention-days: 14
