name: Python Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 2'

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        pip install bandit

    - name: Run Bandit security linter
      run: |
        # Run bandit, store exit code
        bandit -r . -f sarif -o bandit-results.sarif
        EXIT_CODE=$?

        # Validate SARIF has runs array with content
        if [ -f bandit-results.sarif ]; then
          RESULT_COUNT=$(grep -c '"results":\[' bandit-results.sarif || echo "0")
          if [ "$RESULT_COUNT" = "0" ] || ! grep -q '"results":\[' bandit-results.sarif; then
            cat > bandit-results.sarif << 'SARIF'
            {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/sarif-2.1.0-obj.json",
              "runs": [
                {
                  "tool": {
                    "driver": {
                      "name": "Bandit",
                      "version": "1.0.0",
                      "informationUri": "https://bandit.readthedocs.io/",
                      "rules": []
                    }
                  },
                  "results": []
                }
              ]
            }
            SARIF
          fi
        fi

        # Exit with bandit status if it found issues
        exit $EXIT_CODE

    - name: Upload Bandit results
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: bandit-results.sarif
        category: python-bandit