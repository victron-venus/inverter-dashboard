name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  # No longer needed as we specify image in the job
  # REGISTRY: docker.io
  # IMAGE_NAME: alvit/inverter-dashboard

permissions:
  contents: read
  # Required for SBOM / provenance attestations (supply chain, Docker Scout).
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Vue SPA from inverter-dashboard-vue
        run: |
          gh release download --repo victron-venus/inverter-dashboard-vue --pattern 'vue-spa-dist.tar.gz' --dir dist-tmp
          mkdir -p src/inverter_dashboard/static
          tar -xzf dist-tmp/vue-spa-dist.tar.gz -C src/inverter_dashboard/static/
          rm -rf dist-tmp
          echo "Vue SPA installed to src/inverter_dashboard/static/"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push Docker image
        uses: victron-venus/venus-os-ci-toolkit/.github/workflows/docker-build.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
        with:
          skip-checkout: true
          skip-setup-buildx: true
          image: docker.io/alvit/inverter-dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
        secrets:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
