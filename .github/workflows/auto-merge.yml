name: Auto-merge PR (DISABLED)

# DISABLED: auto-merge should not be used with auto-approve.
# PRs from the owner now require manual review before merging to main.
# This ensures human oversight for code that auto-deploys to all installations.
#
# To merge, use: gh pr merge <number> --squash --admin (requires manual approval first)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Warn
        run: echo "Auto-merge is disabled. PRs require manual review and merge."
