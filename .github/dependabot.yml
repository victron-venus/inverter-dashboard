version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "docker"
    # Lock python base image updates: bare-digest bumps floated from Alpine to
    # Debian and broke apk (PRs #92, #104). The Dockerfile pins
    # python:3.14-alpine@sha256:<digest>, so bump the digest by hand when a new
    # Alpine build is wanted. Remove this ignore to resume Dependabot bumps —
    # they stay inside the -alpine family thanks to the tag.
    ignore:
      - dependency-name: "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
